<!doctype html><meta charset="utf-8">
<style>
  html,body{margin:0;padding:0;background:transparent}
  .c{width:1024px;height:1024px;position:relative}
  /* macOS squircle, burgundy cabinet body */
  .body{position:absolute;inset:48px;border-radius:230px;
    background:
      radial-gradient(120% 90% at 50% 0%, #8d1f3b 0%, #5c1226 42%, #2a0a13 100%);
    box-shadow: inset 0 -40px 90px rgba(0,0,0,.65), inset 0 30px 60px rgba(255,255,255,.10);}
  /* chrome arch across the top, the thing that says JUKEBOX at a glance */
  .arch{position:absolute;left:130px;right:130px;top:112px;height:210px;
    border-radius:50% 50% 14px 14px / 92% 92% 14px 14px;
    background:linear-gradient(180deg,#fdfdfd 0%,#c9ced6 30%,#7d858f 54%,#eef2f6 76%,#c9ced6 100%);
    box-shadow:0 10px 26px rgba(0,0,0,.55);}
  .archin{position:absolute;inset:16px 16px 0;
    border-radius:50% 50% 8px 8px / 92% 92% 8px 8px;
    background:radial-gradient(90% 150% at 50% 115%,#ff3d8b 0%,#8d1230 55%,#3d0b1c 100%);
    box-shadow:inset 0 0 40px rgba(0,0,0,.6), 0 0 60px rgba(255,61,139,.55);}
  /* vinyl: reads clearly even at 16px */
  .disc{position:absolute;left:50%;top:586px;transform:translate(-50%,-50%);
    width:430px;height:430px;border-radius:50%;
    background:repeating-radial-gradient(circle at 50% 50%,#0b0b0b 0 7px,#1a1a1a 7px 12px),#111;
    box-shadow:0 18px 40px rgba(0,0,0,.75), 0 0 0 7px rgba(230,240,250,.16);}
  .label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    width:168px;height:168px;border-radius:50%;
    background:radial-gradient(circle at 50% 50%,#fff 0 13%,#ff3d8b 14% 100%);
    box-shadow:inset 0 0 0 5px rgba(0,0,0,.35);}
  /* bubble tubes down the sides */
  .tube{position:absolute;top:300px;bottom:150px;width:40px;border-radius:999px;
    background:linear-gradient(90deg,rgba(0,0,0,.5),rgba(67,232,255,.42) 48%,rgba(0,0,0,.5));
    box-shadow:0 0 26px rgba(67,232,255,.45), inset 0 0 14px rgba(0,0,0,.6);}
  .tube.l{left:108px} .tube.r{right:108px}
</style>
<div class="c">
  <div class="body">
    <div class="arch"><div class="archin"></div></div>
    <div class="tube l"></div><div class="tube r"></div>
    <div class="disc"><div class="label"></div></div>
  </div>
</div>
