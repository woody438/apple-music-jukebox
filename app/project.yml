# The Party Jukebox Mac app. Generate the Xcode project with:
#   cd app && xcodegen generate
# Change build settings here, not in Xcode -- regenerating replaces the project.
#
# The app is a native shell around the same jukebox the repo has always run:
# CI copies a pinned Node (app/node.version) into Contents/MacOS/node and the
# jukebox code into Contents/Resources/jukebox (tools/assemble-app.sh), then
# signs the lot (tools/sign.sh). Built here alone it has neither, and says so.
name: PartyJukebox
options:
  bundleIdPrefix: com.woodall
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"       # CI sets the run number: the updater installs higher builds
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"            # ad hoc here; tools/sign.sh re-signs with the project certificate
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO        # not notarised
    ARCHS: arm64                       # Apple chips only: the bundled Node is arm64
    ONLY_ACTIVE_ARCH: NO
targets:
  PartyJukebox:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources/AppIcon.icns
        buildPhase: resources
    info:
      path: Resources/Info.plist         # generated by XcodeGen from the keys below
      properties:
        CFBundleName: Party Jukebox
        CFBundleDisplayName: Party Jukebox
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleIconFile: AppIcon
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSApplicationCategoryType: public.app-category.music
        LSUIElement: false               # Dock and menu bar, by choice
        NSHighResolutionCapable: true
        NSPrincipalClass: NSApplication
        # The jukebox drives Music with Apple Events. macOS shows this when it
        # asks, and refuses to ask at all if it is missing.
        NSAppleEventsUsageDescription: Party Jukebox plays your guests' picks in Music, and keeps its own Jukebox playlist there. It never changes or deletes anything in your library.
        # Which GitHub release this build is from: CI sets "preview" for a pull request's build.
        PJUpdateChannel: $(UPDATE_CHANNEL)
        PJPreviewPR: $(PREVIEW_PR)
    settings:
      base:
        PRODUCT_NAME: Party Jukebox
        PRODUCT_MODULE_NAME: PartyJukebox
        PRODUCT_BUNDLE_IDENTIFIER: com.woodall.PartyJukebox
        GENERATE_INFOPLIST_FILE: NO
        UPDATE_CHANNEL: latest
        PREVIEW_PR: ""
    scheme: {}                           # shared, so xcodebuild can build it headless
